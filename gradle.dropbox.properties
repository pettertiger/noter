# Dropbox OAuth Configuration
# Generated from Dropbox Developer Console
# https://www.dropbox.com/developers/apps

# Get these values from https://www.dropbox.com/developers/apps
# 1. Create an app named "Noter"
# 2. Copy App Key and App Secret
# 3. Update these values:

